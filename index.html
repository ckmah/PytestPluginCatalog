<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>pytest plugins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@300;400;500&family=Zen+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <header>
    <span class="wordmark">pytest<em>/</em>plugins</span>
    <span class="header-sub">updated daily</span>
    <div class="header-right">
      <span class="header-status" id="statusLabel">—</span>
      <div class="view-toggle">
        <button class="view-btn active" id="listViewBtn" title="List view">≡</button>
        <button class="view-btn" id="graphViewBtn" title="Graph view">⬡</button>
      </div>
      <button class="theme-btn" id="themeBtn" title="Toggle theme">☽</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="toolbar-main">
      <div class="search-wrap">
        <span class="search-ico">⌕</span>
        <input type="text" id="search" placeholder="search plugins…" autocomplete="off" spellcheck="false">
        <span id="searchStatus" class="search-status"></span>
      </div>
      <div class="cat-scroll" id="catChips"></div>
      <div class="sort-wrap">
        <select id="sortSel">
          <option value="category">by category</option>
          <option value="rank" selected>by stars</option>
          <option value="name">by name</option>
          <option value="updated">recently updated</option>
        </select>
      </div>
    </div>
  </div>

  <div id="filterPanel" class="filter-panel"></div>

  <div class="results-bar">
    <span class="results-count" id="resCount">—</span>
    <button class="clear-btn hidden" id="clearBtn">clear ×</button>
  </div>

  <div id="graphPanel" class="hidden">
    <div class="graph-controls">
      <span class="graph-ctrl-lbl">Neighbors</span>
      <input type="range" id="topKSlider" min="2" max="10" value="5" step="1">
      <span class="graph-ctrl-val" id="topKVal">5</span>
      <span class="graph-ctrl-lbl" style="margin-left:6px">Labels</span>
      <label class="graph-ctrl-check">
        <input type="checkbox" id="showLabels" checked>
      </label>
      <span class="graph-stat" id="graphStat">—</span>
      <button class="graph-expand-btn" id="expandGraph" title="Expand">⤢</button>
    </div>
    <svg id="graphSvg" style="height:clamp(360px,60vh,640px)"></svg>
    <div class="graph-legend-row" id="graphLegend"></div>
    <div id="nodeDetail" class="hidden"></div>
  </div>

  <main id="main">
    <div class="loading-state" id="loadingState">
      <div class="loading-spinner"></div>
      <div class="loading-label">loading…</div>
    </div>
  </main>

  <div class="legend">
    <div class="legend-item"><span style="font-family:'DM Mono',monospace;font-size:10px;color:var(--accent)">★ N</span> GitHub stars</div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
