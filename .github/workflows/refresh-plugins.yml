name: Refresh plugins data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install

      - name: Refresh plugins-data.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-plugins-data.js

      - name: Fetch plugin READMEs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-readmes.js

      - name: Generate README summaries (transformers.js)
        env:
          SUMMARY_DEVICE: cpu
        run: node scripts/generate-summaries-transformers.js

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Generate embeddings
        env:
          PATH: ~/.local/bin:${PATH}
        run: uv run scripts/generate-embeddings.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins-data.json data/readme-cache.json data/summaries-cache.json data/embeddings.json
          git diff --staged --quiet || (git commit -m "chore: refresh plugins data" && git push)
